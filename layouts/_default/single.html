{{ partial "header.html" . }}
{{ partial "desk_boot.html" . }}

<header class="desk-top desk-top--simple">
    {{ partial "desk_brand.html" . }}
    <div class="desk-actions">
        <a class="desk-link-sm" href="{{ .Site.Home.RelPermalink }}">返回索引</a>
    </div>
</header>

<main class="desk-prose">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
</main>

{{ partial "desk_fabs.html" (dict "page" . "searchHref" .Site.Home.RelPermalink "searchLabel" "回到索引") }}

<script type="text/javascript" src="{{ absURL "assets/js/site.js" }}?v={{ now.Unix }}" defer></script>
</body>

</html>
