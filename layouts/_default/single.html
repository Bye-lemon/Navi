{{ partial "header.html" . }}

<body class="page-body boxed-container {{ if .Site.Params.nightMode }}io-black-mode{{ else }}io-grey-mode{{ end }}">
    <script>
        // 内容页没有 sidebar partial，这里补上主题 class，避免主题切换跳到浅色。
        (() => {
            const scheme = document.querySelector('meta[name="color-scheme"]')?.content;
            const dark = scheme !== "light";
            document.body.classList.toggle("io-black-mode", dark);
            document.body.classList.toggle("io-grey-mode", !dark);
        })();
    </script>

    <div class="page-container">
        {{ partial "content_header.html" . }}

        <main class="flex-shrink-0">
            <div class="container">
                <h1 class="mt-5">{{ .Title }}</h1>
                <div class="content">
                    {{ .Content | markdownify | safeHTML }}
                </div>
            </div>
        </main>

        <style>
            .content{font-size:14px;}
            .content a{color:#007bff;}
            .content a:hover{color:#f1404b;}
            .content h1,.content h2,.content h3,.content h4{margin: 15px 15px 15px 0px;}
            .content p{line-height:1.5;margin:15px 0;}
            .big-header-banner .page-header{background:gray;}
            .main-content{margin-left:0px;}
            .page-header{left:0px;}
            img{max-width:100%;}
        </style>

        {{ partial "content_footer.html" . }}

        {{ partial "modal_search.html" . }}

{{ partial "footer.html" . }}
