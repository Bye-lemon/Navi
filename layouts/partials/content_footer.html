        <footer class="main-footer footer-type-1 text-xs">
            <div id="footer-tools" class="d-flex flex-column">
                <button type="button" id="go-to-up" class="btn rounded-circle go-up m-1" aria-label="回到顶部">
                    <i class="iconfont icon-to-up" aria-hidden="true"></i>
                </button>
                <!-- 右下角搜索 -->
                <button type="button" class="btn rounded-circle m-1" data-search-open aria-label="打开搜索">
                    <i class="iconfont icon-search" aria-hidden="true"></i>
                </button>
                <!-- 右下角搜索 end -->
                <button type="button" id="theme-toggle" class="btn rounded-circle m-1"
                    aria-pressed="{{ if $.Site.Params.nightMode }}true{{ else }}false{{ end }}"
                    aria-label="{{ if $.Site.Params.nightMode }}切换到浅色模式{{ else }}切换到深色模式{{ end }}"
                    title="切换深色 / 浅色主题">
                    <i class="mode-ico iconfont {{ if $.Site.Params.nightMode }}icon-light{{ else }}icon-night{{ end }}" aria-hidden="true"></i>
                </button>
            </div>
            <div class="footer-inner">
                <div class="footer-text">{{ replace $.Site.Params.footer.copyright "{year}" now.Year | markdownify }}</div>
            </div>
        </footer>
    </div><!-- main-content end -->
</div><!-- page-container end -->
