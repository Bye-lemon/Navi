            if (saved === "light" || saved === "dark") {
                document.querySelector('meta[name="color-scheme"]').content = saved;

<body class="desk-page io-black-mode">
<script>
    (() => {
        const scheme = document.querySelector('meta[name="color-scheme"]')?.content;
        const dark = scheme !== "light";
        document.body.classList.toggle("io-black-mode", dark);
        document.body.classList.toggle("io-grey-mode", !dark);
    })();
    document.addEventListener("error", (event) => {
        const image = event.target;
        if (!(image instanceof HTMLImageElement)) return;
        const fallback = image.dataset.fallback;
        if (!fallback || image.dataset.fallbackApplied === "true") return;
        image.dataset.fallbackApplied = "true";
        image.removeAttribute("srcset");
        image.src = fallback;
    }, true);
</script>
